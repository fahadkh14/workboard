apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: workboard
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: fahadkh14/workboard-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80

          envFrom:
            - configMapRef:
                name: workboard-config

          resources:
            requests:
              cpu: "100m"
              memory: "24Mi"
            limits:
              cpu: "500m"
              memory: "48Mi"

