
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute

metadata:
  name: workboard-route
  namespace: workboard

spec:
  parentRefs:
    - name: workboard-gateway

  rules:
    # All requests go to frontend.
    # Nginx proxies /api requests to backend.
    - matches:
        - path:
            type: PathPrefix
            value: /

      backendRefs:
        - name: frontend
          port: 8070
          weight: 1
