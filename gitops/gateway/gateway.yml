
# Gateway API version
apiVersion: gateway.networking.k8s.io/v1

# Resource type
kind: Gateway

# Gateway metadata
metadata:
  name: workboard-gateway
  namespace: workboard

# Gateway configuration
spec:
  # Use the existing Envoy GatewayClass
  gatewayClassName: envoy

  # Configure HTTP listener
  listeners:
    - name: http
      protocol: HTTP
      port: 80

      # Allow HTTPRoutes from the same namespace
      allowedRoutes:
        namespaces:
          from: Same

