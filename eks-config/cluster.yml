apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: workboard
  region: us-east-1


iam:
  withOIDC: true  


managedNodeGroups:
  - name: ng-default
    instanceType: t3.small
    desiredCapacity: 3
    minSize: 2
    maxSize: 3
    volumeSize: 20
    ssh:
      enableSsm: true
     
addons:
  - name: vpc-cni
  - name: core-dns
  - name: kube-proxy
  - name: aws-ebs-csi-driver
    wellKnownPolicies:
      ebsCSIController: true
