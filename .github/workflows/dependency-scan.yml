# Goal - Ensure frontend & backend Node.js packages
# have been audited for security

name: Dependency Scan

on:
  workflow_call:

jobs:
  dependency-scan:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        app:
          - frontend
          - backend

    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install Dependencies
        run: npm ci
        working-directory: ${{ matrix.app }}

      - name: Dependency Security Audit
        run: npm audit
        working-directory: ${{ matrix.app }}

